<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="232" viewBox="0 0 1060 232" font-family="Liberation Serif, Times New Roman, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A78B5"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <style>
    .t{font-size:15px;fill:#111;text-anchor:middle}
    .s{font-size:12.5px;fill:#333;text-anchor:middle}
    .h{font-size:15px;font-weight:bold;text-anchor:middle}
  </style>
  <!-- groups -->
  <rect x="170" y="28" width="430" height="162" rx="10" fill="#EEF4FB" stroke="#4A78B5" stroke-dasharray="6,4" stroke-width="1.3"/>
  <circle cx="232" cy="43" r="9" fill="none" stroke="#2F5A93" stroke-width="1.4"/><text x="232" y="48" class="h" fill="#2F5A93" style="font-size:13px">1</text><text x="248" y="48" class="h" fill="#2F5A93" style="text-anchor:start">In-situ slot proposal &amp; catalog grounding</text>
  <rect x="625" y="28" width="150" height="162" rx="10" fill="#FDF1E6" stroke="#C9772E" stroke-dasharray="6,4" stroke-width="1.3"/>
  <circle cx="653" cy="43" r="9" fill="none" stroke="#A45A1C" stroke-width="1.4"/><text x="653" y="48" class="h" fill="#A45A1C" style="font-size:13px">2</text><text x="669" y="48" class="h" fill="#A45A1C" style="text-anchor:start">Respelling</text>

  <!-- source -->
  <rect x="20" y="65" width="125" height="65" rx="8" fill="#fff" stroke="#333" stroke-width="1.3"/>
  <text x="82.5" y="88" class="t">Monolingual</text>
  <text x="82.5" y="106" class="t">transcript <tspan font-style="italic">T</tspan></text>
  <text x="82.5" y="122" class="s">(+ source audio)</text>

  <!-- slot proposal -->
  <rect x="185" y="65" width="125" height="65" rx="8" fill="#fff" stroke="#4A78B5" stroke-width="1.3"/>
  <text x="247.5" y="86" class="t">Slot proposal</text>
  <text x="247.5" y="104" class="s">LLM: where to switch</text>
  <text x="247.5" y="120" class="s">(Rep / Ins, no English)</text>

  <!-- grounding -->
  <rect x="330" y="65" width="120" height="65" rx="8" fill="#fff" stroke="#4A78B5" stroke-width="1.3"/>
  <text x="390" y="92" class="t">Catalog grounding</text>
  <text x="390" y="112" class="s">cos(φ(p), φ(c)) ≥ τ</text>

  <!-- variant set (document shape) -->
  <path d="M470,62 h115 v58 q-28.75,14 -57.5,0 t-57.5,0 z" fill="#fff" stroke="#4A78B5" stroke-width="1.3"/>
  <text x="527.5" y="88" class="t">Variant set</text>
  <text x="527.5" y="107" class="s"><tspan font-style="italic">𝒱</tspan>(<tspan font-style="italic">T</tspan>): <tspan font-style="italic">e</tspan> ∈ <tspan font-style="italic">𝒱</tspan><tspan font-size="9" dy="3">ĉ</tspan></text>

  <!-- catalog cylinder -->
  <path d="M335,150 v28 a55,6 0 0 0 110,0 v-28" fill="#DCE8F5" stroke="#4A78B5" stroke-width="1.3"/>
  <ellipse cx="390" cy="150" rx="55" ry="6" fill="#DCE8F5" stroke="#4A78B5" stroke-width="1.3"/>
  <text x="390" y="173" class="s" style="font-size:13px">Term catalog ℰ</text>

  <!-- respelling -->
  <rect x="640" y="65" width="120" height="65" rx="8" fill="#fff" stroke="#C9772E" stroke-width="1.3"/>
  <text x="700" y="86" class="t">Sample spelling</text>
  <text x="700" y="104" class="s">canonical w.p. 1−ρ</text>
  <text x="700" y="120" class="s">respelled w.p. ρ</text>

  <!-- tts -->
  <rect x="800" y="65" width="115" height="65" rx="8" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
  <text x="857.5" y="92" class="t">Full-utterance</text>
  <text x="857.5" y="111" class="t">TTS + ASR filter</text>

  <!-- output -->
  <rect x="940" y="65" width="100" height="65" rx="8" fill="#fff" stroke="#333" stroke-width="2.2"/>
  <text x="990" y="88" class="h" fill="#111">Synthetic CS</text>
  <text x="990" y="106" class="h" fill="#111">corpus</text>
  <text x="990" y="122" class="s">(x̃, y)</text>

  <!-- arrows -->
  <line x1="145" y1="97.5" x2="184" y2="97.5" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="310" y1="97.5" x2="329" y2="97.5" stroke="#4A78B5" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="450" y1="97.5" x2="469" y2="97.5" stroke="#4A78B5" stroke-width="1.4" marker-end="url(#ab)"/>
  <line x1="390" y1="144" x2="390" y2="131" stroke="#4A78B5" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ab)"/>
  <line x1="585" y1="97.5" x2="639" y2="97.5" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="760" y1="97.5" x2="799" y2="97.5" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="772" y="88" width="14" height="16" fill="#fff"/>
  <text x="779" y="101" class="s" font-style="italic" style="font-size:14px">z</text>
  <line x1="915" y1="97.5" x2="939" y2="97.5" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- label bypass -->
  <polyline points="570,63 570,12 990,12 990,64" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ag)"/>
  <rect x="700" y="4" width="140" height="16" fill="#fff"/>
  <text x="770" y="16" class="s" font-style="italic">label y (canonical)</text>

  <!-- example -->
  <text x="472" y="218" style="font-size:14px;text-anchor:middle;font-style:italic">ờ khởi động lại cái <tspan font-weight="bold">máy chủ</tspan> này giúp mình nhé   →   … cái <tspan font-weight="bold" fill="#2F5A93">server</tspan> này …   →   … cái <tspan font-weight="bold" fill="#A45A1C">sơ-vơ</tspan> này …</text>
</svg>
